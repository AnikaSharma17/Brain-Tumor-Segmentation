[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-segmentation"
version = "0.1.0"
description = "U-Net brain tumor segmentation comparing pretrained encoder backbones."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { text = "MIT" }
dependencies = [
    "tensorflow==2.15.0",
    "numpy>=1.23,<2.0",
    "pandas>=2.0,<2.3",
    "matplotlib>=3.7,<3.9",
    "openpyxl>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
demo = ["gradio>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"]  # module-level imports after matplotlib.use(...)
